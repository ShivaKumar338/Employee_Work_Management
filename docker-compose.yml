version: "3.9"

# ============================================================
# OrchestAI — Optional Docker Compose
# ============================================================
# Docker is NOT required for local development.
# Use this only if you prefer a containerised setup.
#
# Usage:
#   docker-compose up --build          Start everything
#   docker-compose down                Stop all containers
#   docker-compose down -v             Stop + delete volumes (reset DB)
#   docker-compose logs -f backend     Follow backend logs
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 15
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: orchestai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestai
      POSTGRES_PASSWORD: orchestai_pass
      POSTGRES_DB: orchestai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestai -d orchestai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis 7 (optional — only needed for Celery)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orchestai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: orchestai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orchestai:orchestai_pass@postgres:5432/orchestai_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app       # Hot-reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ----------------------------------------------------------
  # Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: orchestai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend/src:/app/src    # Hot-reload in dev
      - /app/node_modules               # Preserve container node_modules

volumes:
  postgres_data:
    driver: local
